<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OzonUz — ozon va UV monitoringi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F4; --paper:#FFFFFF; --ink:#142235; --ink2:#4A5A6E; --line:#CBD7E0; --soft:#F4F8FA;
  --ozone:#3E55C6; --ozone-ink:#FFFFFF; --tile:#127F88; --warn:#C23A2B; --ok:#2C7A4B;
  --uv1:#3A9A1E; --uv2:#E8C800; --uv3:#F57A00; --uv4:#D8001D; --uv5:#7A4FD1;
  --display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A27; --paper:#162436; --ink:#E6EDF4; --ink2:#9DB0C3; --line:#2A3C52; --soft:#1B2C40;
    --ozone:#7D90F0; --ozone-ink:#0F1A27; --tile:#3DB7BF; --warn:#FF7A69; --ok:#5FC28A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A27; --paper:#162436; --ink:#E6EDF4; --ink2:#9DB0C3; --line:#2A3C52; --soft:#1B2C40;
  --ozone:#7D90F0; --ozone-ink:#0F1A27; --tile:#3DB7BF; --warn:#FF7A69; --ok:#5FC28A; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--ozone)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ozone);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.6vw,2.6rem)}
h2{font-size:clamp(1.2rem,2.2vw,1.6rem)}
h3{font-size:1.02rem;font-weight:500}
p{margin:0 0 .8em;max-width:68ch}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ozone);color:var(--ozone-ink)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.brand b{font-family:var(--display);font-size:1.15rem;letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;opacity:.85;line-height:1.1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{color:inherit;text-decoration:none;padding:8px 11px;border-radius:7px;white-space:nowrap;font-weight:500;font-size:.93rem;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.14);opacity:1}
.nav a[aria-current="page"]{background:var(--paper);color:var(--ink);opacity:1}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.seg{display:inline-flex;border:1px solid currentColor;border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 8px;font-size:.8rem;font-weight:600;cursor:pointer;color:inherit}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.btn-cab{background:none;border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-weight:600;font-size:.85rem;cursor:pointer;color:inherit;text-decoration:none}
.demo-strip{background:var(--soft);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--ink2)}
.demo-strip div{max-width:1320px;margin:0 auto;padding:5px 16px}

main{max-width:1320px;margin:0 auto;padding:24px 16px 56px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ozone);color:var(--ozone-ink);border-color:var(--ozone)}
.btn.sm{padding:5px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:.86rem;font-weight:500;margin:0 0 4px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ozone)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.84rem}
.tbl{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.est{font-size:.75rem;font-weight:600;color:var(--ink2);border:1px dashed var(--ink2);border-radius:5px;padding:1px 6px;white-space:nowrap}
.uvdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}

/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:22px}
.hero-txt .place{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.uvbig{font-family:var(--display);font-size:clamp(4.2rem,11vw,7.5rem);line-height:.9;font-weight:700;letter-spacing:-.04em}
.uvcat{font-family:var(--display);font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:500;margin:6px 0 12px}
.arc-wrap{position:relative}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin:8px 0 28px}
.stat{padding:14px 16px 14px 0}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat .v{font-family:var(--display);font-size:1.55rem;font-weight:500;letter-spacing:-.02em}
.stat .k{font-size:.86rem;color:var(--ink2)}
.stat .d{font-size:.82rem;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.modlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.modlist a{background:var(--paper);padding:16px;text-decoration:none;color:var(--ink);display:block}
.modlist a:hover{background:var(--soft)}
.modlist b{display:block;font-family:var(--display);font-weight:500;margin-bottom:4px;font-size:.98rem}

/* map layout */
.maplay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.mapbox{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:340px}
.mapbox svg.map{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.mapbox svg.map:active{cursor:grabbing}
.mapbox .zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapbox .zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:1.1rem;cursor:pointer}
.mapbox .legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.78rem;max-width:calc(100% - 20px)}
.legend .bar{height:10px;width:200px;max-width:100%;border-radius:3px;margin:4px 0 2px}
.legend .ticks{display:flex;justify-content:space-between;width:200px;max-width:100%}
.legend .cats{display:flex;gap:8px;flex-wrap:wrap}
.reg{stroke:var(--paper);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .15s}
.reg:hover{stroke:var(--ink);stroke-width:1.6}
.reg.sel{stroke:var(--ink);stroke-width:2.4}
.anom{fill:url(#hatch);pointer-events:none}
.anom-line{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl{font:600 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;pointer-events:none;text-anchor:middle}
.pt{stroke:var(--paper);stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
.side{display:grid;gap:12px}
.side .panel{padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600;text-align:right}.kv dd.num{white-space:nowrap}
.big{font-family:var(--display);font-size:2rem;font-weight:500;letter-spacing:-.02em}

/* uv */
.daytabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.daytab{flex:1;min-width:120px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left}
.daytab[aria-pressed="true"]{border:2px solid var(--ink);padding:9px 11px}
.daytab .mx{font-family:var(--display);font-size:1.5rem;font-weight:500}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.scale div{padding:10px;border-radius:8px;font-size:.85rem;color:#fff}
.scale div b{display:block;font-family:var(--display);font-weight:500;font-size:1rem}
.scale .c2{color:#3a3000}
.advice li{margin-bottom:6px}

/* bars */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;font-size:.9rem;padding:4px 0}
.hbar .track{height:14px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.hbar .track span{display:block;height:100%}

/* bot */
.phone{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;height:420px}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:.9rem;white-space:pre-wrap;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--ozone);color:var(--ozone-ink);border-bottom-right-radius:3px}
.msg.b{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;z-index:99;font-weight:500;max-width:90vw}
.cabnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.status-new{background:#FFF3C4;color:#5a4500;border-color:#E8C800}
.status-checked{background:#DDE6FF;color:#1E2E7A;border-color:#8FA2EE}
.status-sent{background:#D7F0F2;color:#0C5258;border-color:#7CC3C8}
.status-solved{background:#D9F2E1;color:#1C5A33;border-color:#86C99D}
.status-rejected{background:#F7DADA;color:#7A1F1F;border-color:#DFA0A0}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:20px 16px;font-size:.85rem;color:var(--ink2)}
footer div{max-width:1320px;margin:0 auto}
.prose h2{margin-top:1.4em}
.prose{max-width:820px}

.uvlay{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:980px){
  .uvlay{grid-template-columns:minmax(0,1fr)}
  .maplay{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .modlist{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:700px){
  .top-in{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  .nav{order:3;flex-basis:100%}
  .tools{margin-left:auto}
  .brand small{display:none}
  .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .two,.modlist{grid-template-columns:minmax(0,1fr)}
  .scale{grid-template-columns:minmax(0,1fr)}
  main{padding:16px 12px 48px}
  .hbar{grid-template-columns:100px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</header>
<div class="demo-strip"><div id="demoStrip"></div></div>
<main id="app"></main>
<footer><div id="foot"></div></footer>

function translitWord(w){
  if(/^[A-Z0-9₀-₉_\-\/.]+$/.test(w)&&w.length>1) return w; // UV, CSV, NO₂, ESP32
  if(/[a-z]/.test(w)&&/.[A-Z]/.test(w)) return w; // OzonUz, OzonUzBot
  let out="",i=0;const L=w.length;
  while(i<L){
    const c=w[i],lc=c.toLowerCase(),up=c!==lc,two=w.substr(i,2).toLowerCase(),nx=w[i+1];
    const cap=s=>up?s[0].toUpperCase()+s.slice(1):s;
    if((lc==="o"||lc==="g")&&(nx==="ʻ"||nx==="'"||nx==="‘"||nx==="`")){out+=cap(lc==="o"?"ў":"ғ");i+=2;continue}
    if(two==="sh"){out+=cap("ш");i+=2;continue}
    if(two==="ch"){out+=cap("ч");i+=2;continue}
    if(two==="yo"){out+=cap("ё");i+=2;continue}
    if(two==="yu"){out+=cap("ю");i+=2;continue}
    if(two==="ya"){out+=cap("я");i+=2;continue}
    if(two==="ye"){out+=cap("е");i+=2;continue}
    if(c==="ʼ"||c==="'"||c==="’"){out+="ъ";i++;continue}
    if(lc==="e"){const prev=w[i-1];out+=cap(!prev||!/[a-zA-Zʻ']/.test(prev)?"э":"е");i++;continue}
    if(CYR[lc]){out+=cap(CYR[lc]);i++;continue}

}

  const W=520,H=290,cx=260,cy=262,R=220,seg=[];const N=90;

/* bot simulator */
let BOT=[];
function botUI(){return `<div class="phone"><div class="chat" id="chat" aria-live="polite"></div><div class="chips">${["/start","/uv","/forecast","/subscribe","/report","/lang"].map(c=>`<button class="chip" data-cmd="${c}">${c}</button>`).join("")}</div><div class="small muted">${esc(t("bot_note"))}</div></div>`}
function botReply(c){
  const f=byId(S.place);const ms=nowMs();const u=uvAt(f,ms),cat=uvCat(u);
  const near=SENSORS.find(s=>{const dx=(s.lon-f.properties.c[0])*84,dy=(s.lat-f.properties.c[1])*111;return Math.hypot(dx,dy)<=5});
  if(c==="/start")return tl("Здравствуйте! Я OzonUz — сообщаю УФ-индекс и предупреждаю об опасном солнце.\n/uv — УФ сейчас\n/forecast — прогноз на 3 дня\n/subscribe — ежедневная рассылка\n/report — сообщить о сбросе хладагента\n/lang — язык","Assalomu alaykum! Men OzonUz — UV-indeksni aytaman va xavfli quyoshdan ogohlantiraman.\n/uv — hozirgi UV\n/forecast — 3 kunlik prognoz\n/subscribe — kundalik xabar\n/report — sovutkich agent haqida xabar\n/lang — til");
  if(c==="/uv"){let s=`📍 ${nm(f)}\n☀️ UV ${fmt(u,1)} — ${t("c"+cat)}\n${t("a"+cat)}`;if(near){const r=sensorReadings(near);if(r.length)s+=`\n📡 ${tl("Датчик","Datchik")} ${near.id}: ${fmt(r[r.length-1].uv,1)} (${t("est_mark")})`}return s}
  if(c==="/forecast")return `📍 ${nm(f)}\n`+[0,1,2].map(i=>{const v=hourly(f,TODAY+i);const m=Math.max(...v);return `${dayLabel(TODAY+i)}: ${tl("макс.","maks.")} ${fmt(m,1)} (${t("c"+uvCat(m))}), ${t("avoid").toLowerCase()} ${avoidHours(v)||"—"}`}).join("\n");
  if(c==="/subscribe")return tl(`✅ Подписка оформлена: ${nm(f)}. Каждый день в 08:00 — прогноз; если ожидается УФ ≥ ${SET.uvAlert} — срочное уведомление.`,`✅ Obuna rasmiylashtirildi: ${byId(S.place).properties.uz}. Har kuni 08:00 da — prognoz; UV ≥ ${SET.uvAlert} kutilsa — shoshilinch ogohlantirish.`);
  if(c==="/report")return tl("Отправьте фото и геолокацию, затем выберите тип:\n1 — сброс хладагента\n2 — брошенные холодильники/кондиционеры\n3 — другое\nОбращение получит статус «Новое».","Rasm va joylashuvni yuboring, soʻng turini tanlang:\n1 — sovutkich agent chiqarilishi\n2 — tashlab ketilgan sovutgich/konditsioner\n3 — boshqa\nMurojaat «Yangi» holatini oladi.");
  if(c==="/lang")return "🇺🇿 Oʻzbekcha (lotin)\n🇺🇿 Ўзбекча (кирилл)\n🇷🇺 Русский";
}
function bindBot(){const ch=$("#chat");const draw=()=>{ch.innerHTML=BOT.map(m=>{const tx=m.u?m.c:botReply(m.c);return `<div class="msg ${m.u?"u":"b"}">${esc(LANG==="uzc"&&!m.u?translit(tx):tx)}</div>`}).join("");ch.scrollTop=ch.scrollHeight};
  if(!BOT.length)BOT=[{u:1,c:"/start"},{c:"/start"}];draw();
  $$("[data-cmd]").forEach(b=>b.onclick=()=>{BOT.push({u:1,c:b.dataset.cmd},{c:b.dataset.cmd});BOT=BOT.slice(-14);draw()})}

let playT=null;
function pageMap(){
  app.innerHTML=`<h1>${esc(t("n_map"))}</h1>

        <div class="row" style="margin-top:10px;justify-content:space-between">
          <div class="chips" id="per">${["day","month","season"].map(p=>`<button class="chip" data-p="${p}" aria-pressed="${S.period===p}">${esc(t("p_"+p))}</button>`).join("")}</div>
          <button class="btn sm" id="playB">▶ ${esc(t("play"))}</button>
        </div>
      </div>
      <div class="panel" id="card"></div>
      <div class="panel" id="anomP"></div>
      <div class="row"><button class="btn sm" id="csvB">${esc(t("exp_csv"))}</button><button class="btn sm" id="pngB">${esc(t("exp_png"))}</button></div>
    </aside>
  </div>`;
  const M=makeMap($("#mapEl"),{features:REG,aria:t("n_map"),onClick:f=>{S.sel=f.id;drawMap()}});
  function drawMap(){
    const vals={};REG.forEach(f=>vals[f.id]=layerVal(S.layer,f,S.date,S.period));
    const dm=S.mode==="dev"&&S.layer!=="uv";
    const dv=f=>(vals[f.id].v-vals[f.id].n)/vals[f.id].n*100;
    const col=dm?(S.layer==="o3"?v=>o3dev(v):v=>no2dev(v)):S.layer==="o3"?v=>o3col(v):S.layer==="no2"?v=>no2col(v):v=>UVHEX[uvCat(v)];
    const unit=S.layer==="o3"?t("du"):S.layer==="no2"?"µmol/m²":"UV";
    $("#mode").innerHTML=S.layer==="uv"?"":[["abs",unit],["dev",tl("% к норме","meʼyorga %")]].map(([k,l])=>`<button class="chip" data-m="${k}" aria-pressed="${(S.mode||"abs")===k}">${esc(l)}</button>`).join("");
    $$("#mode .chip").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;drawMap()});
    M.paint(f=>col(dm?dv(f):vals[f.id].v),f=>`${nm(f)}: ${fmt(vals[f.id].v,S.layer==="uv"?1:0)} ${unit}${vals[f.id].n?` (${sgn(dv(f))}%)`:""}`,S.opacity);
    M.select(S.sel);
    const an=S.layer==="o3"?REG.filter(f=>(vals[f.id].v-vals[f.id].n)/vals[f.id].n*100<-SET.anom):[];
    M.anoms(an);
    M.legend(dm?gradLegend(t("l_"+S.layer)+", "+t("deviation").toLowerCase(),S.layer==="o3"?O3DEV:NO2DEV,"%"):S.layer==="o3"?gradLegend(t("l_o3"),O3STOPS,t("du")):S.layer==="no2"?gradLegend(t("l_no2"),NO2STOPS,"µmol/m²"):uvLegend());
    // card
    const card=$("#card");
    if(!S.sel){card.innerHTML=`<h3>${esc(t("ranking"))}</h3>`+REG.map(f=>[f,vals[f.id].v]).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([f,v])=>`<div class="row small" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><a href="javascript:void 0" data-sel="${f.id}">${esc(nm(f))}</a><b class="num">${fmt(v,S.layer==="uv"?1:0)}</b></div>`).join("");
      $$("[data-sel]",card).forEach(a=>a.onclick=()=>{S.sel=a.dataset.sel;drawMap()});}
    else{
      const f=byId(S.sel),v=vals[f.id];const dev=v.n?(v.v-v.n)/v.n*100:null;
      const months=[];const ser=[],nor=[];for(let i=11;i>=0;i--){const dt=dayToDate(S.date);const m0=Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()-i,1);const d0=Math.round((m0-EPOCH)/DAY);months.push(mon(new Date(m0).getUTCMonth()));
        if(d0<0){ser.push(null);nor.push(null);continue}
        let s=0,n=0,c=0;for(let k=0;k<30;k+=3){const dd=Math.min(d0+k,TODAY);if(S.layer==="o3"){s+=ozone(f,dd);n+=ozoneNorm(f,dd)}else if(S.layer==="no2"){s+=no2(f,dd);n+=no2Norm(f,dd)}else{s+=uvDailyMax(f,dd)}c++}ser.push(s/c);nor.push(S.layer==="uv"?null:n/c)}
      card.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-start"><h3 style="margin:0">${esc(nm(f))}</h3><button class="btn sm" id="clsC" aria-label="×">×</button></div>
       <div class="big num" style="margin:6px 0">${fmt(v.cur,S.layer==="uv"?1:0)} <span class="small muted">${esc(unit)}</span></div>
       <dl class="kv"><dt>${esc(t("avg_period"))} (${esc(t("p_"+S.period).toLowerCase())})</dt><dd class="num">${fmt(v.v,S.layer==="uv"?1:0)}</dd>
       ${v.n?`<dt>${esc(t("norm"))}</dt><dd class="num">${fmt(v.n,0)}</dd><dt>${esc(t("deviation"))}</dt><dd class="num" style="color:${dev<0&&S.layer==="o3"?"var(--warn)":"inherit"}">${sgn(dev)}%</dd>`:""}</dl>
       ${dev!=null&&S.layer==="o3"&&dev<-SET.anom?`<p class="small" style="color:var(--warn);margin-top:8px">⚠ ${esc(t("anomaly"))} ${SET.anom}%</p>`:""}
       <div class="small muted" style="margin-top:10px">${esc(t("last12"))}</div>
       ${lineChart({series:[{vals:ser,color:"var(--ozone)",label:t("l_"+S.layer),dots:true},...(S.layer==="uv"?[]:[{vals:nor,color:"var(--ink2)",dash:"4 4",label:t("norm")}])],labels:months,h:170,w:360,dec:S.layer==="uv"?1:0})}`;
      $("#clsC").onclick=()=>{S.sel=null;M.select(null);drawMap()};
    }
    $("#anomP").innerHTML=`<h3>${esc(t("anomalies_list"))} · ${esc(fullDate(S.date))}</h3>${S.layer!=="o3"?`<p class="small muted">${esc(tl("Аномалии считаются для слоя озона.","Anomaliyalar ozon qatlami uchun hisoblanadi."))}</p>`:an.length?an.map(f=>`<div class="small">⚠ ${esc(nm(f))}: <b class="num">${sgn((vals[f.id].v-vals[f.id].n)/vals[f.id].n*100)}%</b></div>`).join(""):`<p class="small muted">${esc(t("no_anom"))} (${esc(tl("порог","chegara"))} −${SET.anom}%)</p>`}`;
    $("#dIn").value=isoDay(S.date);$("#dRg").value=S.date;
    M.vals=vals;
  }
  $$("#lyr .chip").forEach(b=>b.onclick=()=>{S.layer=b.dataset.l;persist();$$("#lyr .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));drawMap()});
  $$("#per .chip").forEach(b=>b.onclick=()=>{S.period=b.dataset.p;persist();$$("#per .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));drawMap()});
  $("#opc").oninput=e=>{S.opacity=+e.target.value;drawMap()};
  $("#dRg").oninput=e=>{S.date=+e.target.value;drawMap()};
  $("#dIn").onchange=e=>{const d=isoToDay(e.target.value);if(!isNaN(d)){S.date=clamp(d,90,TODAY);drawMap()}};
  $("#playB").onclick=()=>{if(playT){clearInterval(playT);playT=null;$("#playB").textContent="▶ "+t("play");return}
    if(S.date>=TODAY-7)S.date=TODAY-365;$("#playB").textContent="■ "+t("stop");playT=setInterval(()=>{S.date+=7;if(S.date>=TODAY){S.date=TODAY;clearInterval(playT);playT=null;$("#playB").textContent="▶ "+t("play")}drawMap()},350);timers.push(()=>{clearInterval(playT);playT=null})};
  $("#csvB").onclick=()=>{const rows=[["region_id","region","date","period","layer","value","norm","deviation_pct"]];REG.forEach(f=>{const v=M.vals[f.id];rows.push([f.id,nm(f),isoDay(S.date),S.period,S.layer,v.v.toFixed(2),v.n?v.n.toFixed(2):"",v.n?((v.v-v.n)/v.n*100).toFixed(2):""])});saveFile(`ozonuz_${S.layer}_${isoDay(S.date)}.csv`,"\ufeff"+rows.map(csvRow).join("\n"))};
  $("#pngB").onclick=()=>svgToPng($("#mapEl svg"),`ozonuz_${S.layer}_${isoDay(S.date)}.png`).catch(()=>toast(t("dl_unavail")));
  drawMap();
}

     <div class="tbl"><table class="small"><tbody>${CROPS.map(cr=>`<tr><td><span class="uvdot" style="background:${CROPCOL[cr]};border-radius:2px"></span>${esc(t(cr))}</td><td class="num">${fmt(AREA[f.id][cr],1)} ${tl("тыс. га","ming ga")}</td><td class="num">${fmt(r[cr],1)} t</td></tr>`).join("")}</tbody></table></div>`;
    $("#agX").onclick=()=>{S.agroSel=null;draw()};
  }
  draw();
  const upd=()=>{const s2=n2oAll({crop:S.scCrop,pct:S.scPct});$("#scPv").textContent=S.scPct+"%";$("#scRes").innerHTML=`${fmt(s2.total)} <span class="small">${esc(t("t_year"))}</span>`;$("#scSav").textContent=`${t("saved")}: −${fmt(base.total-s2.total)} t N₂O · −${fmt((base.total-s2.total)*SET.gwp)} t CO₂e`};

const RTYPES=["ref","fridge","other"];const STAT=["new","checked","sent","solved","rejected"];
function regOfRep(r){const f=regionAt(r.lon,r.lat);return f?f.id:null}
function pageReports(){
  const pub=REPORTS.filter(r=>["checked","sent","solved"].includes(r.status));
  const byR={},byT={};pub.forEach(r=>{const g=regOfRep(r);if(g)byR[g]=(byR[g]||0)+1;byT[r.type]=(byT[r.type]||0)+1});

  <div class="maplay">
    <div><div id="rpMap"></div><p class="small muted" style="margin-top:6px">${esc(t("place_hint"))}</p>
      <div class="two" style="margin-top:12px">
        <div class="panel"><h3>${esc(t("by_region"))}</h3>${Object.keys(byR).length?hbars(Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([id,n])=>({label:nm(byId(id)),total:n,parts:[{v:n,c:"var(--tile)"}]})),Math.max(...Object.values(byR))):`<p class="small muted">${esc(t("empty_rep"))}</p>`}</div>
        <div class="panel"><h3>${esc(t("by_type"))}</h3>${pub.length?hbars(RTYPES.filter(x=>byT[x]).map(x=>({label:t("t_"+x),total:byT[x],parts:[{v:byT[x],c:"var(--ozone)"}]})),Math.max(...Object.values(byT))):`<p class="small muted">—</p>`}</div>
      </div>
      <div class="panel" style="margin-top:12px"><h3>${esc(t("public_map"))} (${pub.length})</h3>${pub.length?`<div class="tbl"><table><tbody>${pub.slice().sort((a,b)=>b.created-a.created).slice(0,12).map(r=>`<tr>${r.photo?`<td style="width:64px"><img class="thumb" src="${esc(r.photo)}" alt=""></td>`:"<td></td>"}<td><b>${esc(t("t_"+r.type))}</b><div class="small">${esc(r.text||"")}</div><div class="small muted">${esc(nm(byId(regOfRep(r))||{properties:{uz:"—",ru:"—"}}))} · ${esc(fullDate(localDayIdx(r.created)))}</div></td><td><span class="tag status-${r.status}">${esc(t("s_"+r.status))}</span></td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">${esc(t("empty_rep"))}</p>`}</div>
    </div>
    <aside class="side"><form class="panel" id="rpF" novalidate>
      <h3>${esc(t("new_rep"))}</h3>
      <fieldset style="border:0;padding:0;margin:0 0 10px"><legend class="f" style="font-weight:500;font-size:.86rem;margin-bottom:4px">${esc(t("rtype"))}</legend>
      ${RTYPES.map((x,i)=>`<label class="small" style="display:flex;gap:8px;align-items:center;margin:3px 0"><input type="radio" name="rt" value="${x}" ${i===0?"checked":""}> ${esc(t("t_"+x))}</label>`).join("")}</fieldset>
      <label class="f" for="rpT">${esc(t("descr"))}</label><textarea id="rpT" maxlength="600"></textarea>
      <label class="f" for="rpPh" style="margin-top:10px">${esc(t("photo"))}</label><input type="file" id="rpPh" accept="image/*" capture="environment"><div id="rpPrev" style="margin-top:6px"></div>
      <label class="f" style="margin-top:10px">${esc(t("place"))}</label><div class="small" id="rpPl">${S.repPt?`✓ ${esc(t("place_set"))}: ${S.repPt[1].toFixed(4)}, ${S.repPt[0].toFixed(4)}`:esc(t("place_hint"))}</div>
      <button type="button" class="btn sm" id="rpLoc" style="margin-top:6px">◎ ${esc(t("locate"))}</button>
      ${API_OK===false?`<p class="small muted" style="margin-top:10px">${esc(t("local_only"))}</p>`:""}
      <button type="submit" class="btn pri" style="margin-top:14px;width:100%;justify-content:center">${esc(t("send"))}</button>
    </form></aside>
  </div>`;
  const M=makeMap($("#rpMap"),{features:REG,aria:t("rep_title"),onPoint:(ll)=>{S.repPt=ll;drawPts();$("#rpPl").textContent=`✓ ${t("place_set")}: ${ll[1].toFixed(4)}, ${ll[0].toFixed(4)}`}});
  M.paint(()=>"var(--soft)",f=>nm(f));
  $$("#rpMap path.reg").forEach(p=>p.style.stroke="var(--line)");
  function drawPts(){M.points([...pub.map(r=>({lat:r.lat,lon:r.lon,color:r.type==="ref"?"#C23A2B":r.type==="fridge"?"#3E55C6":"#127F88",r:8,title:`${t("t_"+r.type)} — ${t("s_"+r.status)}`})),...(S.repPt?[{lat:S.repPt[1],lon:S.repPt[0],color:"#142235",r:11,title:t("place_set")}]:[])])}
  drawPts();
  let photo=null;
  $("#rpPh").onchange=async e=>{const file=e.target.files[0];if(!file)return;photo=await shrink(file);$("#rpPrev").innerHTML=photo?`<img class="thumb" src="${photo}" alt="">`:""};
  $("#rpLoc").onclick=()=>locate((f,c)=>{S.repPt=[c.longitude,c.latitude];drawPts();$("#rpPl").textContent=`✓ ${t("place_set")}: ${c.latitude.toFixed(4)}, ${c.longitude.toFixed(4)}`});
  $("#rpF").onsubmit=async e=>{e.preventDefault();const text=$("#rpT").value.trim();if(!S.repPt){toast(t("need_place"));return}if(!text){toast(t("need_text"));$("#rpT").focus();return}
    const rec={type:$("input[name=rt]:checked").value,text,lat:+S.repPt[1].toFixed(5),lon:+S.repPt[0].toFixed(5),status:"new",created:Date.now(),source:"web",photo:photo||""};
    try{
      const resp=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)});
      if(resp.status===422||resp.status===429){const j=await resp.json().catch(()=>({}));toast(j.error==="outside_uz"?t("outside_uz"):j.error==="too_many"?t("too_many"):t("err"));return}
      if(!resp.ok)throw new Error("api "+resp.status);
      toast(t("sent_ok"));S.repPt=null;await loadReports();pageReports()}
    catch(err){const l=lsGet("ozrep",[]);rec.id="l"+Date.now();l.push(rec);lsSet("ozrep",l);REPORTS.push(rec);toast(t("local_only"));S.repPt=null;pageReports()}};
}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,420/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.68))};img.onerror=()=>res(null);img.src=URL.createObjectURL(file)})}

  ${P("В этой версии значения считаются моделью: климатическая норма озона по широте и сезону, суточные колебания и эпизоды понижения; УФ — по положению солнца, озону, высоте и облачности. Структура данных совпадает с API из ТЗ (/api/ozone, /api/uv/forecast, /api/n2o, /api/sensors), поэтому подключение реальных источников не меняет интерфейс.","Ushbu versiyada qiymatlar model orqali hisoblanadi: kenglik va mavsum boʻyicha ozon meʼyori, kundalik tebranishlar va pasayish epizodlari; UV — quyosh holati, ozon, balandlik va bulutlilik boʻyicha. Maʼlumotlar tuzilmasi TT dagi API ga mos (/api/ozone, /api/uv/forecast, /api/n2o, /api/sensors), shuning uchun haqiqiy manbalarni ulash interfeysni oʻzgartirmaydi.")}
  ${P("Границы регионов и районов: открытые GeoJSON (OpenStreetMap), упрощённые для быстрой загрузки на телефоне.","Hudud va tuman chegaralari: ochiq GeoJSON (OpenStreetMap), telefonda tez yuklanishi uchun soddalashtirilgan.")}
  </article>`;
}

/* ===================== CABINET ===================== */
const ROLE_LVL={analyst:1,moderator:2,admin:3};
function pageCabinet(){
  if(S.role&&S.role!=="analyst"&&API_OK&&ROLE_API!=="admin"){S.role=null;persist()}
  if(!S.role){app.innerHTML=`<h1>${esc(t("cab_title"))}</h1><p class="muted">${esc(t("cab_lead"))}</p><div class="row">${["analyst","moderator","admin"].map(r=>`<button class="btn" data-r="${r}">${esc(t(r==="analyst"?"r_analyst":r==="moderator"?"r_mod":"r_admin"))}</button>`).join("")}</div>`;
    $$("[data-r]").forEach(b=>b.onclick=async()=>{const role=b.dataset.r;
      if(role!=="analyst"){const tk=(prompt(t("adm_token"))||"").trim();if(!tk)return;admSet(tk);await loadReports();
        if(API_OK&&ROLE_API!=="admin"){admSet("");toast(t("bad_token"));return}}
      S.role=role;S.cab=S.role==="moderator"?"mod":"dash";persist();pageCabinet()});return}
  const lv=ROLE_LVL[S.role];const secs=[["dash",1],["mod",2],["exp",1],["set",3],["adm",3]];
  if(!secs.find(s=>s[0]===S.cab&&s[1]<=lv))S.cab=lv>=2&&S.cab==="mod"?"mod":"dash";
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="margin:0">${esc(t("cab_title"))}</h1><div class="row"><span class="tag">${esc(t(S.role==="analyst"?"r_analyst":S.role==="moderator"?"r_mod":"r_admin"))}</span><button class="btn sm" id="lo">${esc(t("logout"))}</button></div></div>
   <nav class="cabnav" style="margin-top:14px">${secs.map(([k,l])=>`<button class="chip" data-c="${k}" aria-pressed="${S.cab===k}" ${l>lv?"disabled":""}>${esc(t("c_"+k))}</button>`).join("")}</nav><div id="cab"></div>`;
  $("#lo").onclick=()=>{S.role=null;persist();pageCabinet()};
  $$("[data-c]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.cab=b.dataset.c;pageCabinet()});
  ({dash:cabDash,mod:cabMod,exp:cabExp,set:cabSet,adm:cabAdm})[S.cab]($("#cab"));
}
function regSelect(id,cur){return `<select id="${id}">${REG.map(f=>`<option value="${f.id}" ${f.id===cur?"selected":""}>${esc(nm(f))}</option>`).join("")}</select>`}
function cabDash(el){
  const f=byId(S.cabReg);const o=ozone(f,TODAY),on=ozoneNorm(f,TODAY);const n=no2(f,TODAY);const u=uvDailyMax(f,TODAY);
  const reps=REPORTS.filter(r=>regOfRep(r)===f.id).length;
  const lab=[],so=[],sn=[],s2=[];for(let i=51;i>=0;i--){const d=TODAY-i*7;lab.push(mon(dayToDate(d).getUTCMonth()));let a=0,b=0,c=0;for(let k=0;k<7;k++){a+=ozone(f,d-k);b+=ozoneNorm(f,d-k);c+=no2(f,d-k)}so.push(a/7);sn.push(b/7);s2.push(c/7)}
  const anomDays=[];for(let i=0;i<90;i++){const d=TODAY-i;const dv=(ozone(f,d)-ozoneNorm(f,d))/ozoneNorm(f,d)*100;if(dv<-SET.anom)anomDays.push([d,dv])}
  el.innerHTML=`<div class="row" style="margin-bottom:12px"><label class="f" for="cr" style="margin:0">${esc(t("your_region"))}</label><div style="min-width:240px">${regSelect("cr",S.cabReg)}</div></div>
   <section class="stats" style="margin-top:0">
    <div class="stat"><div class="k">O₃</div><div class="v num">${fmt(o)} ${esc(t("du"))}</div><div class="d" style="color:${o<on?"var(--warn)":"var(--ok)"}">${sgn((o-on)/on*100)}% ${esc(t("vs_norm"))}</div></div>
    <div class="stat"><div class="k">NO₂</div><div class="v num">${fmt(n)}</div><div class="d muted">µmol/m²</div></div>
    <div class="stat"><div class="k">${esc(t("max_today"))} UV</div><div class="v num"><span class="uvdot" style="background:${UVCOL[uvCat(u)]}"></span>${fmt(u,1)}</div><div class="d">${esc(t("c"+uvCat(u)))}</div></div>
    <div class="stat"><div class="k">${esc(t("n_reports"))}</div><div class="v num">${reps}</div><div class="d muted">${esc(tl("всего","jami"))}</div></div></section>
   <div class="two"><div class="panel"><h3>${esc(t("dash_trend"))}</h3>${lineChart({series:[{vals:so,color:"var(--ozone)",label:"O₃"},{vals:sn,color:"var(--ink2)",dash:"4 4",label:t("norm")}],labels:lab,h:190,unit:t("du")})}${lineChart({series:[{vals:s2,color:"#A8703A",label:"NO₂"}],labels:lab,h:130,unit:"µmol/m²"})}</div>
   <div class="panel"><h3>${esc(tl("Дни с аномалией озона за 90 дней","90 kun ichida ozon anomaliyasi kunlari"))}: ${anomDays.length}</h3>${anomDays.length?`<div class="tbl"><table class="small"><tbody>${anomDays.slice(0,15).map(([d,v])=>`<tr><td>${esc(fullDate(d))}</td><td class="num" style="color:var(--warn)">${sgn(v)}%</td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">${esc(t("no_anom"))}</p>`}</div></div>`;
  $("#cr").onchange=e=>{S.cabReg=e.target.value;persist();cabDash(el)};
}
function cabMod(el){
  const list=REPORTS.slice().sort((a,b)=>(a.status==="new"?0:1)-(b.status==="new"?0:1)||b.created-a.created);
  el.innerHTML=list.length?`<div class="panel tbl"><table><thead><tr><th></th><th>${esc(t("rtype"))}</th><th>${esc(t("region"))}</th><th>${esc(t("when"))}</th><th>${esc(t("status"))}</th></tr></thead><tbody>
   ${list.map(r=>`<tr>${r.photo?`<td><img class="thumb" src="${esc(r.photo)}" alt=""></td>`:"<td></td>"}<td><b>${esc(t("t_"+r.type))}</b><div class="small">${esc(r.text)}</div><div class="small muted">${esc(t("from"))}: ${esc(t(r.source==="bot"?"src_bot":"src_web"))} · ${r.lat}, ${r.lon}</div></td><td class="small">${esc(nm(byId(regOfRep(r))||{properties:{uz:"—",ru:"—"}}))}</td><td class="small">${esc(fullDate(localDayIdx(r.created)))} ${hhmm(r.created)}</td>
   <td><select data-id="${esc(r.id)}" aria-label="${esc(t("status"))}">${STAT.map(s=>`<option value="${s}" ${s===r.status?"selected":""}>${esc(t("s_"+s))}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`:`<div class="panel"><p class="muted">${esc(t("queue_empty"))}</p></div>`;
  $$("select[data-id]",el).forEach(s=>s.onchange=async()=>{const id=s.dataset.id,v=s.value;const r=REPORTS.find(x=>x.id===id);
    try{if(!id.startsWith("l")){const resp=await fetch(API,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+admTok()},body:JSON.stringify({id:+id,status:v})});if(!resp.ok)throw new Error(resp.status);r.status=v}else{r.status=v;const l=lsGet("ozrep",[]);const q=l.find(x=>x.id===id);if(q){q.status=v;lsSet("ozrep",l)}}toast(t("s_"+v))}catch(e){toast(t("err")+": "+(e.message||""));s.value=r.status}});
}
function cabExp(el){
  el.innerHTML=`<div class="panel" style="max-width:560px"><h3>${esc(t("report_for"))}</h3>
   <label class="f" for="er">${esc(t("region"))}</label>${regSelect("er",S.cabReg)}
   <div class="two" style="margin-top:10px"><div><label class="f" for="e1">${esc(t("from_d"))}</label><input type="date" id="e1" min="2019-01-01" max="${isoDay(TODAY)}" value="${isoDay(TODAY-30)}"></div><div><label class="f" for="e2">${esc(t("to_d"))}</label><input type="date" id="e2" min="2019-01-01" max="${isoDay(TODAY)}" value="${isoDay(TODAY)}"></div></div>
   <p class="small muted" style="margin-top:10px">${esc(tl("Колонки: дата, озон, норма, отклонение, NO₂, УФ-макс; в конце — N₂O (для Ферганской обл.) и число обращений. PDF-отчёт — этап 2.","Ustunlar: sana, ozon, meʼyor, ogʻish, NO₂, UV-maks; oxirida — N₂O (Fargʻona vil. uchun) va murojaatlar soni. PDF-hisobot — 2-bosqich."))}</p>
   <button class="btn pri" id="eg">${esc(t("gen_csv"))}</button></div>`;
  $("#eg").onclick=()=>{const f=byId($("#er").value);let a=isoToDay($("#e1").value),b=isoToDay($("#e2").value);if(isNaN(a)||isNaN(b))return;if(a>b)[a,b]=[b,a];a=Math.max(a,0);b=Math.min(b,TODAY);if(b-a>800)a=b-800;
    const rows=[["date","ozone_du","norm_du","deviation_pct","no2_umol_m2","uv_max"]];for(let d=a;d<=b;d++){const o=ozone(f,d),n=ozoneNorm(f,d);rows.push([isoDay(d),o.toFixed(1),n.toFixed(1),((o-n)/n*100).toFixed(2),no2(f,d).toFixed(1),uvDailyMax(f,d).toFixed(1)])}
    rows.push([]);if(f.id==="fer")rows.push(["n2o_t_per_year",n2oAll().total.toFixed(1)]);rows.push(["reports_total",REPORTS.filter(r=>regOfRep(r)===f.id).length]);
    saveFile(`ozonuz_${f.id}_${isoDay(a)}_${isoDay(b)}.csv`,"\ufeff"+rows.map(csvRow).join("\n"))};
}
function cabSet(el){
  const num=(k,v,step)=>`<input type="number" step="${step}" data-k="${k}" value="${v}">`;
  el.innerHTML=`<form class="grid" id="setF" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
   <div class="panel"><h3>${esc(tl("Пороги","Chegaralar"))}</h3><label class="f">${esc(t("thr_anom"))}</label>${num("anom",SET.anom,1)}<label class="f" style="margin-top:8px">${esc(t("thr_uv"))}</label>${num("uvAlert",SET.uvAlert,1)}</div>
   <div class="panel"><h3>${esc(t("coef"))}</h3>${[["ef1","EF₁"],["ef1rice","EF₁ rice"],["gasf","Frac_GASF"],["ef4","EF₄"],["leach","Frac_LEACH"],["ef5","EF₅"],["gwp","GWP N₂O"],["odp","ODP N₂O"]].map(([k,l])=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-bottom:4px"><label class="small" style="flex:1">${l}</label><div style="width:110px">${num(k,SET[k],.001)}</div></div>`).join("")}</div>
   <div class="panel"><h3>${esc(t("nrates"))}</h3>${CROPS.map(c=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-bottom:4px"><label class="small" style="flex:1">${esc(t(c))}, kg N/ha</label><div style="width:110px">${num("rate."+c,SET.rates[c],5)}</div></div>`).join("")}</div>
   <div class="row"><button class="btn pri" type="submit">${esc(t("save"))}</button><button class="btn" type="button" id="setR">${esc(t("reset"))}</button></div></form>`;
  $("#setF").onsubmit=e=>{e.preventDefault();$$("[data-k]",el).forEach(i=>{const v=parseFloat(i.value);if(isNaN(v))return;if(i.dataset.k.startsWith("rate."))SET.rates[i.dataset.k.slice(5)]=v;else SET[i.dataset.k]=v});lsSet("ozset",SET);toast(t("set_saved"))};
  $("#setR").onclick=()=>{SET=JSON.parse(JSON.stringify(DEFAULT_SET));lsSet("ozset",SET);cabSet(el);toast(t("set_saved"))};
}
function cabAdm(el){

    ${[["eco.fergana",t("r_analyst"),"fer"],["minzdrav.tash",t("r_analyst"),"tsh"],["mod.uzcosmos",t("r_mod"),"—"],["admin",t("r_admin"),"—"]].map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${r[2]==="—"?"—":esc(nm(byId(r[2])))}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="panel"><h3>${esc(t("log"))}</h3><div class="tbl"><table class="small"><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("source"))}</th><th>${esc(t("status"))}</th><th></th></tr></thead><tbody>
    ${logs.slice(0,16).map((l,i)=>`<tr><td class="num">${isoDay(l.d)}</td><td>${esc(l.s)}<div class="muted">${esc(l.a)}</div></td><td>${l.ok?`<span class="tag status-solved">${esc(t("ok"))}</span>`:`<span class="tag status-rejected">${esc(t("err"))}</span><div class="muted">${esc(l.msg)}</div>`}</td><td>${l.ok?"":`<button class="btn sm" data-rs="${i}">${esc(t("restart"))}</button>`}</td></tr>`).join("")}</tbody></table></div></div></div>`;

const ROUTES={"":pageHome,map:pageMap,uv:pageUV,agro:pageAgro,reports:pageReports,sensors:pageSensors,about:pageAbout,cabinet:pageCabinet};
function chrome(){
  document.documentElement.lang=LANG==="ru"?"ru":"uz";
  $("#brandSub").textContent=t("brandSub");$("#demoStrip").textContent=t("demo");$("#cabBtn").textContent=t("cabinet");
  const r=(location.hash.replace(/^#\/?/,"").split("/")[0])||"";
  $("#nav").innerHTML=[["","n_home"],["map","n_map"],["uv","n_uv"],["agro","n_agro"],["reports","n_reports"],["sensors","n_sensors"],["about","n_about"]].map(([k,l])=>`<a href="#/${k}" ${k===r?'aria-current="page"':""}>${esc(t(l))}</a>`).join("");
  $("#langSeg").innerHTML=LANGS.map(([k,l])=>`<button data-lang="${k}" aria-pressed="${LANG===k}">${l}</button>`).join("");

function route(){
  timers.forEach(f=>f());timers=[];
  const r=(location.hash.replace(/^#\/?/,"").split("/")[0])||"";chrome();
  (ROUTES[r]||pageHome)();
  if(!route._first)window.scrollTo(0,0);route._first=false;
}

REPORTS=lsGet("ozrep",[]);
route();
loadReports();setInterval(()=>{if(!document.hidden)loadReports()},60000);
